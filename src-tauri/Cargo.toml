[package]
name = "md-studio"
version = "0.2.0"
description = "MD Studio — secure local Markdown editor"
authors = ["MD Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "md_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
md-studio-core = { path = "crates/md-studio-core" }
tauri = { version = "2.4.0", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-opener = "2.2.6"
tauri-plugin-single-instance = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
sha2 = "0.10.8"
hex = "0.4.3"
walkdir = "2.5.0"
ignore = "0.4.23"
notify = "7.0.0"
uuid = { version = "1.16.0", features = ["v4"] }
parking_lot = "0.12.3"

[dev-dependencies]
tempfile = "3.19.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
