configuration:
  - src-tauri/tauri.conf.json: janelas main (oculta até splash fechar) e splashscreen, CSP, bundle, fileAssociations (md, markdown, mdx)
  - src-tauri/capabilities/default.json: core:default, dialog:allow-open/save/ask, opener:allow-open-url (janela main)
  - vite.config.ts, tsconfig.json, rust-toolchain.toml
  - frontend localStorage keys: md-studio-settings-v2, md-studio-session-v2, md-studio.recent-files, md-studio.ui-state, md-studio.file-tree.expanded, md-studio.panel-width.<side>, md-studio.split-ratio, md-studio-draft:v3:<doc>

persisted_data:
  - user Markdown files (save atômico tmp+fsync+rename via md-studio-core::persistence)
  - <workspace>/.mdstudio/index.json (MetadataIndex serializado, gravação atômica)
  - exports HTML/EPUB em destino absoluto escolhido pelo usuário (atomic_write_bytes)
  - localStorage do webview (settings, sessão, recentes, UI, rascunhos)
  - nota: .mdstudio/index.json do próprio repositório está versionado apesar de .mdstudio estar no .gitignore

infra_ci:
  - .github/workflows/ci.yml: pnpm build + cargo test (core e src-tauri)
  - .github/workflows/security-gates.yml: scripts/install-security-tools.sh
  - .github/workflows/build-linux.yml: pnpm tauri build (.deb, .AppImage, .rpm), release em tags v*
  - .github/workflows/build-windows.yml: pnpm tauri build (NSIS/MSI), release em tags v*

packaging:
