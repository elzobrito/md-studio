product:
  name: MD Studio
  version: 0.2.3            # package.json, src-tauri/Cargo.toml, tauri.conf.json, snap/snapcraft.yaml
  identifier: dev.mdstudio.app
  kind: desktop local-first Markdown editor (offline)
  license: MIT

applications:
  - id: APP-FRONTEND
    name: Webview frontend (React SPA)
    root: src/
    entrypoints: [index.html, src/main.tsx, src/App.tsx]
    runtime: Tauri webview (produção) | navegador (modo browser/demo via src/lib/browserFs.ts)
    language: TypeScript 5.8 (TSX)
  - id: APP-DESKTOP-SHELL
    name: Tauri 2 backend (Rust)
    root: src-tauri/
    entrypoints: [src-tauri/src/main.rs, src-tauri/src/lib.rs]
    crate: md-studio (lib md_studio_lib)
    language: Rust (toolchain 1.96.1, rust-toolchain.toml)
  - id: APP-SPLASH
    name: Splashscreen window
    files: [splashscreen.html, public/splashscreen.html]
    window_label: splashscreen

technologies:
  frontend:
    framework: React 19.0.0
    editor: CodeMirror 6 (@codemirror/* 6.x)
    markdown_pipeline: unified 11 + remark-parse/gfm/frontmatter/math/directive + remark-rehype + rehype-raw + rehype-sanitize 6 + rehype-katex 7
    syntax_highlight: shiki 4 via @shikijs/rehype (catppuccin-latte/mocha); highlight.js e rehype-highlight ainda em package.json
    math: katex 0.16.21
    diagrams: mermaid 11.16.1 + @panzoom/panzoom
    presentation: reveal.js 6
    formatter_web: prettier 3 standalone
    validation: zod 3.24 (front matter), yaml 2.8
    build: vite 6.4 (porta 1420)
    test: vitest 4.1 + jsdom 26
    package_manager: pnpm 9.15.4 (node >= 20; CI usa 22.14.0)
  backend:
    framework: tauri 2.4 (+ tauri-plugin-dialog, tauri-plugin-opener, tauri-plugin-single-instance)
    fs_watch: notify 7
    hashing: sha2 + hex (SHA-256)
    paths: dunce, walkdir
    ids: uuid v4
    sync: parking_lot
    epub: epub-builder 0.7, zip 0.6, html5ever/markup5ever/markup5ever_rcdom (0.25/0.10/0.1 em source_commit)
    test: cargo test + tempfile

packages:
  - id: PKG-NPM-MD-STUDIO
    manifest: package.json
    lockfile: pnpm-lock.yaml
    workspace: pnpm-workspace.yaml
    scripts: {dev: vite, build: "tsc -b && vite build", test: "vitest run", typecheck: "tsc -b --pretty false", tauri: tauri}
  - id: PKG-CRATE-MD-STUDIO
    manifest: src-tauri/Cargo.toml
    lockfile: src-tauri/Cargo.lock
    lib: md_studio_lib (staticlib, cdylib, rlib)
    depends_on: [PKG-CRATE-MD-STUDIO-CORE]
  - id: PKG-CRATE-MD-STUDIO-CORE
    manifest: src-tauri/crates/md-studio-core/Cargo.toml
    lockfile: src-tauri/crates/md-studio-core/Cargo.lock
    purpose: lógica pura testável sem Tauri (persistência, workspace fence, índice, parsers, export EPUB, launch args)
    modules: [persistence, workspace, launch, index, parser, export]

source_layout:
  frontend:
    src/App.tsx: shell React, atalhos globais, orquestração de painéis, export, apresentação
    src/state/: documentState (workspace+documento+save+watch), settings, session, editor, recent-files, ui
    src/lib/ipc/: "fachada IPC (client.ts: comandos de workspace/save/export/watch + diálogos; metadata.ts: comandos de metadados)"
    src/lib/drafts/recovery.ts: rascunhos em localStorage
    src/lib/browserFs.ts: File System Access API / demo para modo navegador
    src/services/: save, export (HTML/EPUB), formatter, navigation, diagramExport, assets, workspaceEvents
    src/markdown/: pipeline unified (processor, sanitize, shiki, frontmatter, plugins/wiki-links, plugins/alerts, fencedCode, mermaid, math)
    src/editor/: extensões CodeMirror (formatting, slash, wiki completion, table, paste, hints, line-highlight)
    src/components/: UI (header, explorer, editor, wiki, settings, statusbar, command, empty, help, layout, workspace)
    src/export/: epubProcessor, mermaidCapture, epubTypes
    src/presentation/: Presentation Mode (reveal.js)
    src/security/urlPolicy.ts: política de URL (não conectada ao pipeline; só testada)
    src/contracts/types.ts: DTOs IPC em TypeScript
    src/types/: metadata.ts (DTOs de metadados), file-tree.ts, fs-access.d.ts
    src/templates/index.ts: 7 modelos de documento
    src/styles/: CSS (inclui print.css para PDF)
  backend:
    src-tauri/src/lib.rs: AppState, plugins, registro dos 21 comandos (generate_handler!), evento app://open-file
    src-tauri/src/commands/mod.rs: open_workspace, list_entries, read_document, save_document, search_workspace, export_html, export_epub, get_launch_path, close_splash
    src-tauri/src/commands/metadata.rs: 10 comandos de metadados/wiki/backlinks
    src-tauri/src/commands/formatter.rs: format_code (CLIs nativas, timeout 2s)
    src-tauri/src/watcher/mod.rs: WatcherHub (notify, debounce 300ms, supressão de eco), start/stop_watching, evento workspace://change
    src-tauri/src/contracts/mod.rs: DTOs IPC Rust (camelCase)
    src-tauri/src/{persistence,workspace}/mod.rs: re-export do core
    src-tauri/src/{assets,diagnostics,search}/mod.rs: helpers sem chamador no app (assets::read_asset, diagnostics::safe_message) / placeholder (search)
    src-tauri/crates/md-studio-core/src/: persistence.rs, workspace.rs, launch.rs, index/*, parser/*, export/*

