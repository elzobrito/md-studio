task_id: MD-GUI-053-H
impact_summary: "Centralização e formalização dos design tokens do MD Studio R3 (tokens de cor, superfícies, sidebar, inspector, bordas, foco, dimensões de controles, raios e z-index) e criação do Icon Registry local nativo em SVG para substituir emojis e garantir ausência total de dependências remotas ou CDNs."
affected_files:
  - src/styles/design-tokens.css
  - src/styles/themes/light.css
  - src/styles/themes/dark.css
  - src/styles/themes.css
  - src/components/icons/index.tsx
  - tests/runtime/design-tokens-icons.test.ts
  - docs/spec/053-H-design-tokens-iconography.md
