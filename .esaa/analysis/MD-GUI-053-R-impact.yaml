task_id: MD-GUI-053-R
impact_summary: "Consolidação e auditoria de acessibilidade WAI-ARIA no MD Studio R3: foco visível consistente (:focus-visible) com anéis de foco em temas dark/light (WCAG 2.4.7 Focus Visible), padronização de prefers-reduced-motion eliminando transições/animações sob preferência de sistema (WCAG 2.3.3 Animation from Interactions), e verificação de semântica ARIA para tabs, menus, modais, statusbar e árvore de arquivos."
affected_files:
  - src/styles/design-tokens.css
  - src/styles/app-shell.css
  - tests/runtime/accessibility-keyboard.test.ts
