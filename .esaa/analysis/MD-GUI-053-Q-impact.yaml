task_id: MD-GUI-053-Q
impact_summary: "Adaptação do painel unificado de configurações (SettingsPanel) com gerenciamento de foco (focus trap em Tab/Shift+Tab, restore do elemento ativo anterior ao fechar), ciclo de vida acessível com atributos ARIA (role='dialog', aria-modal='true', aria-labelledby), e infraestrutura unificada de toasts flutuantes não-bloqueantes com live region acessível (role='status', aria-live='polite', pointer-events: none)."
