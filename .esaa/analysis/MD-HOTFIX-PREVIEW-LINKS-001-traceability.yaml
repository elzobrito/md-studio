task_description_used: >-
  "Corrigir bug onde cliques em links Markdown padrão e âncoras não eram interceptados, causando navegação acidental do Webview
  para fora da SPA e reset para a tela de boas-vindas. Implementar resolução de links relativos, navegação de âncoras e abertura
  externa com tauri-plugin-opener."
bias: >-
  O grafo foi construído em 5fe4f4d (depois do hotfix), então nós criados pelo próprio hotfix (ex.: resolveRelativeLink,
  openExternalUrl, navigation.ts) já aparecem como nós existentes. Numa projeção real pré-mudança eles seriam 'nós novos'.
  A projeção usa estrutura com vantagem de retrospectiva; o footprint re-localiza âncoras no commit (anchor_resolution) e marca
  como missing o que não existia no pai.
