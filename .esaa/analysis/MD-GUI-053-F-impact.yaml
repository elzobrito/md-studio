  - .esaa/tasks/MD-GUI-053-F.yaml
  - .esaa/analysis/MD-GUI-053-F-impact.yaml
security_analysis:
  path_deduplication: "Path index normalizado impede abertura duplicada de abas para o mesmo arquivo em disco, eliminando risco de race conditions em saves paralelos."
  isolated_document_scope: "Operações de edição, undo, redo, save e descarte em um documentId são estritamente isoladas e não causam vazamento em documentos adjacentes."
verification_evidence:
