task_id: MD-GUI-053-F
impact_summary: "Implementação do core multi-documento de produção (DocumentRuntime e OpenDocumentsRuntime), integrando os resultados dos 4 spikes normativos: contentIdentity e SaveQueue (053-B), UntitledStore (053-C), estratégia Single View + setState (053-D) e WorkspaceFsReconciler (053-E)."
affected_files:
  - src/services/runtime/documentRuntime.ts
  - src/services/runtime/openDocumentsRuntime.ts
  - tests/runtime/open-documents-runtime.test.ts
