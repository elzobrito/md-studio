security_analysis:
  two_zone_model: "Separação estrita entre zona de leitura externa (somente leitura pontual do arquivo selecionado) e zona de destino no workspace."
  path_fencing: "O destino do Markdown e de qualquer asset extraído é validado rigorosamente sob a raiz do workspace, rejeitando traversals ('..'), caminhos absolutos ou escapes."
  no_mutation_of_source: "O arquivo original de origem nunca é modificado, movido ou excluído."
  no_network: "Toda a operação de importação é 100% offline e local; nenhuma URL remota ou LLM externa é invocada."
  atomic_commit: "Gravação final utiliza atomic save e preflight de colisões sem sobrescrita silenciosa."
