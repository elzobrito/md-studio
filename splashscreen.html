<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #181818;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        user-select: none;
        border: 1px solid #2e2e2e;
      }
      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 26px;
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.25);
      }
      .app-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #f3f4f6;
      }
      .status {
        margin-top: 18px;
        font-size: 12px;
        color: #9ca3af;
        letter-spacing: 0.2px;
      }
      .loader-bar {
        margin-top: 14px;
        width: 140px;
        height: 3px;
        background: #2e2e2e;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: #3b82f6;
        border-radius: 2px;
        animation: progress 1.2s infinite ease-in-out;
      }
      @keyframes progress {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <div class="logo-icon">M↓</div>
      <div class="app-title">MD Studio</div>
      <div class="status">Iniciando workspace...</div>
      <div class="loader-bar"></div>
    </div>
  </body>
</html>
