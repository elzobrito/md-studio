name: md-studio
title: MD Studio
base: core24 # Base Ubuntu 24.04 LTS
version: '0.2.0'
summary: Editor Markdown local para documentação técnica e engenharia no Linux
description: |
  O MD Studio é um editor Markdown local-first, leve e 100% offline para Linux, construído com Tauri 2 (Rust) e React 19 / TypeScript.
  
  Projetado para engenheiros de software, autores técnicos e equipes de tecnologia que mantêm sua documentação em arquivos .md no próprio disco, o MD Studio reúne direto da caixa:
  
  * Realce e Formatação de Código: Shiki (TextMate dual-themes claro/escuro) e formatação híbrida (Prettier Web + formatadores nativos como ruff, rustfmt, gofmt, clang-format).
  * Diagramas Interativos: Mermaid.js com zoom, pan fluido e exportação fiel para SVG e PNG com estilos computados embutidos.
  * Interconexão de Documentos: Wiki links ([[nota]]), autocompletar instantâneo e painel de backlinks com busca contextual no workspace.
  * Fórmulas Matemáticas: Renderização matemática rápida e precisa com KaTeX.
  * Persistência Atômica & Auto-Save: Gravação segura com fsync e supressão de notificações internas no inotify para evitar falsos conflitos.
  * Privacidade & Segurança: 100% offline, local-first e proteção estrita contra XSS via AST sanitizado.

grade: stable
confinement: strict # Exigência para publicação direta na loja
icon: src-tauri/icons/icon.png
license: MIT
website: https://github.com/elzobrito/md-studio
source-code: https://github.com/elzobrito/md-studio
issues: https://github.com/elzobrito/md-studio/issues
contact: https://github.com/elzobrito/md-studio

# Permissões do sistema que o MD Studio precisa
apps:
  md-studio:
    command: bin/md-studio
    extensions: [gnome] # Já injeta WebKitGTK, Wayland/X11, fontes e temas GTK
    plugs:
      - home             # Leitura/escrita na home do usuário (~/)
      - removable-media # Permite abrir e salvar arquivos em pendrives (/media, /mnt)
      - network         # Para downloads de dependências/assets externos (se aplicável)

parts:
  md-studio:
    plugin: nil
    source: .
    build-packages:
      - git
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - libssl-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - pkg-config
      - xz-utils
    override-build: |
      # 1. Se dist/ não existir, compila o frontend
      if [ ! -d "dist" ]; then
        curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
        corepack enable
        corepack prepare pnpm@9.15.4 --activate
        rm -rf node_modules
        pnpm install --frozen-lockfile --config.confirmModulesPurge=false
        pnpm build
      fi

      # 2. Instalar toolchain Rust estável oficial
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      . "$HOME/.cargo/env"

      # 3. Compilar o binário Tauri em release
      cargo build --release --manifest-path src-tauri/Cargo.toml

      # 4. Instalar o executável no snap
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp src-tauri/target/release/md-studio "$SNAPCRAFT_PART_INSTALL/bin/"